<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swipe Dice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the whole screen is the dice. Each die is a full-bleed panel in its own color with white pips; slide a finger anywhere to roll. Two round buttons at the bottom change the number of dice. */
:root {
  color-scheme: dark;
  --bg: #14171c;
  --pip: #ffffff;
  --btn-bg: rgba(255, 255, 255, 0.28);
  --btn-fg: #ffffff;
  --c1: #ef6a6a;
  --c2: #f7a24b;
  --c3: #f1e65a;
  --c4: #6fd08c;
  --c5: #86cbea;
  --c6: #b496f5;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  overflow: hidden;
  overscroll-behavior: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  touch-action: none;
  cursor: grab;
}
@media (orientation: landscape) { #stage { flex-direction: row; } }

.panel {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  display: grid;
  place-items: center;
  container-type: size;
  transition: background-color 0.18s ease;
}
.face {
  width: min(62cqw, 62cqh);
  aspect-ratio: 1;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
}
#stage .panel:last-child .face { margin-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
@media (orientation: landscape) {
  #stage .panel .face { margin-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}
.pip {
  place-self: center;
  width: 74%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--pip);
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
  transition: transform 0.14s ease, opacity 0.14s ease;
}
.pip.off { transform: scale(0.2); opacity: 0; }
.face.spin { animation: tumble 0.34s linear infinite; }
.face.slow { animation: tumble 0.8s ease-out infinite; }
.face.land { animation: land 0.42s cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes tumble {
  0%   { transform: rotate(0deg) scale(0.9); }
  50%  { transform: rotate(180deg) scale(1.05); }
  100% { transform: rotate(360deg) scale(0.9); }
}
@keyframes land {
  0%   { transform: rotate(-14deg) scale(0.86); }
  100% { transform: rotate(0deg) scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .pip, .panel { transition: none; }
  .face.spin, .face.slow, .face.land { animation: none; }
}

#bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: flex;
  justify-content: center;
  gap: 28px;
  padding-top: 8px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#bar button {
  pointer-events: auto;
  width: 44px; height: 44px;
  border: 0; border-radius: 50%;
  background: var(--btn-bg);
  color: var(--btn-fg);
  display: grid; place-items: center;
  cursor: pointer;
  padding: 0;
}
#bar button:disabled { opacity: 0.35; cursor: default; }
#bar button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
#turn {
  position: fixed; left: 0; right: 0; z-index: 2;
  bottom: calc(68px + env(safe-area-inset-bottom, 0px));
  padding: 0 16px; text-align: center; color: #fff; pointer-events: none;
  font: 700 20px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
}
#turn[hidden] { display: none; }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: #1d2128; color: #f2f4f7;
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  border-radius: 16px 16px 0 0;
  padding-top: 18px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px;
  box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.4);
  max-height: 82%; overflow-y: auto;
  -webkit-user-select: text; user-select: text;
}
#sheet[hidden] { display: none; }
#sheet .note { margin: -6px 0 0; font-size: 13px; color: #9aa6b4; }
.panel { position: relative; }
.rule {
  position: absolute; left: 0; right: 0; top: max(7%, env(safe-area-inset-top, 0px));
  padding: 0 16px; text-align: center; color: #fff;
  font: 800 clamp(18px, 6cqw, 34px)/1.15 system-ui, -apple-system, "Segoe UI", sans-serif;
  text-shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
  text-wrap: balance; pointer-events: none;
}
#sheet .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
#sheet .row.col { flex-direction: column; align-items: stretch; gap: 10px; }
#sheet output { color: #9aa6b4; margin-left: 6px; font-variant-numeric: tabular-nums; }
#sheet input[type="checkbox"] { width: 22px; height: 22px; accent-color: #86cbea; }
#sheet input[type="range"] { width: 100%; accent-color: #86cbea; }
#done { font: inherit; font-weight: 600; background: #f2f4f7; color: #14171c; border: 0; border-radius: 10px; padding: 12px; cursor: pointer; }
#sheet .txt { width: 100%; resize: vertical; }
#sheet .btns { display: flex; gap: 8px; }
#sheet .btns .ghost { margin-top: 0; }
#sheet select, #sheet .rf input, #sheet .txt {
  font: inherit; color: #f2f4f7; background: #2a303a; border: 1px solid #3a4250;
  border-radius: 8px; padding: 9px 10px; min-width: 0;
}
#sheet .fieldlabel { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #9aa6b4; margin-bottom: 8px; }
#ruleFields { display: flex; flex-direction: column; gap: 8px; }
#sheet .rf { display: flex; align-items: center; gap: 10px; }
#sheet .rf b { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 50%; font-size: 12px; color: #14171c; }
#sheet .rf input { flex: 1; }
#sheet .ghost { margin-top: 10px; font: inherit; color: #c4cdd8; background: transparent; border: 1px solid #3a4250; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
#sheet :focus-visible { outline: 2px solid #86cbea; outline-offset: 2px; }
#bar svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; fill: none; }
</style>

<main id="stage" aria-label="Dice. Slide a finger across the screen to roll."></main>
<div id="bar">
  <button type="button" id="gear" aria-label="Settings" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button>
  <button type="button" id="minus" aria-label="Fewer dice"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button type="button" id="plus" aria-label="More dice"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
</div>

<section id="sheet" role="dialog" aria-label="Settings" hidden>
  <label class="row">
    <span>Roll on tap</span>
    <input type="checkbox" id="tapRoll" role="switch">
  </label>
  <label class="row">
    <span>Mode</span>
    <select id="modeSel">
      <option value="off">Off</option>
    </select>
  </label>
  <p class="note" id="modeNote" hidden></p>
  <div id="editor" hidden>
    <div class="fieldlabel">Your rules, one per die face</div>
    <div id="ruleFields"></div>
    <button type="button" id="resetRules" class="ghost">Reset to defaults</button>
  </div>
  <label class="row">
    <span>Roll sounds</span>
    <input type="checkbox" id="soundOn" role="switch">
  </label>
  <label class="row col">
    <span>Players, separated by commas</span>
    <input type="text" id="players" class="txt" maxlength="200" placeholder="Anna, Omar, Lisa">
  </label>
  <div class="row col">
    <span>Share your rules</span>
    <textarea id="shareBox" class="txt" rows="3" placeholder="Copy makes a code. Paste a friend's code here and press Load."></textarea>
    <div class="btns">
      <button type="button" class="ghost" id="copyRules">Copy</button>
      <button type="button" class="ghost" id="loadRules">Load</button>
    </div>
  </div>
  <label class="row col">
    <span>Swipe length per roll <output id="stepOut"></output></span>
    <input type="range" id="stepRange" min="15" max="90" step="5">
  </label>
  <button type="button" id="done">Done</button>
</section>

<div id="turn" hidden></div>

<div id="live" role="status" aria-live="polite" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden"></div>

<script>
(function () {
  var MIN = 1, MAX = 3;
  var settings = { tap: false, step: 34, mode: "off", rules: {}, sound: false, players: "" };
  var DEFAULTS = {
    party: {
      1: "You take a sip",
      2: "Give 2 sips to someone",
      3: "Everyone takes a sip",
      4: "Pick a category. Loser sips",
      5: "Never have I ever",
      6: "Truth or dare"
    },
    flirty: {
      1: "Give a compliment",
      2: "Hold hands for a minute",
      3: "Slow dance",
      4: "Shoulder massage",
      5: "Share your best date memory",
      6: "Kiss on the cheek"
    },
    truth: {
      1: "Truth: your most embarrassing moment",
      2: "Dare: do your best dance move",
      3: "Truth: a secret talent",
      4: "Dare: speak in an accent for 2 rounds",
      5: "Truth: the last lie you told",
      6: "Pick truth or dare for someone else"
    },
    wyr: {
      1: "Would you rather fly or be invisible?",
      2: "Would you rather never sleep or never eat?",
      3: "Would you rather live in the past or the future?",
      4: "Would you rather have no phone or no music for a year?",
      5: "Would you rather be famous or rich?",
      6: "Would you rather talk to animals or speak every language?"
    },
    workout: {
      1: "10 squats",
      2: "20 second plank",
      3: "10 push-ups",
      4: "15 jumping jacks",
      5: "10 lunges on each leg",
      6: "Wall sit for 30 seconds"
    },
    charades: {
      1: "Act out a movie",
      2: "Sing a song of your choice",
      3: "Act out an animal",
      4: "Hum a song, others guess",
      5: "Act out a job",
      6: "Draw in the air, others guess"
    },
    family: {
      1: "Hop on one foot for 10 seconds",
      2: "Make a funny face",
      3: "Tell a joke",
      4: "Name 5 animals in 10 seconds",
      5: "Do your best robot walk",
      6: "Give everyone a high five"
    },
    decide: {
      1: "Option A",
      2: "Option B",
      3: "Option C",
      4: "Ask again",
      5: "Flip a coin",
      6: "Everyone votes"
    },
    study: {
      1: "Define a key term",
      2: "Explain it in one sentence",
      3: "Give an example",
      4: "Quiz someone else",
      5: "Name a common mistake",
      6: "Teach it to the group"
    }
  };
  var MODES = [
    { id: "party", label: "Party (drinking)" },
    { id: "flirty", label: "Flirty" },
    { id: "truth", label: "Truth or dare" },
    { id: "wyr", label: "Would you rather" },
    { id: "workout", label: "Workout" },
    { id: "charades", label: "Charades and karaoke" },
    { id: "family", label: "Kids and family" },
    { id: "decide", label: "Decision maker" },
    { id: "study", label: "Study quiz" }
  ];
  function ruleText(v) {
    var m = settings.mode;
    if (m === "off" || !DEFAULTS[m]) return "";
    var custom = settings.rules[m] && settings.rules[m][v];
    return typeof custom === "string" ? custom : DEFAULTS[m][v];
  }
  try {
    var s = JSON.parse(localStorage.getItem("swipedice.settings") || "null");
    if (s) {
      settings.tap = s.tap === true;
      settings.sound = s.sound === true;
      if (typeof s.players === "string") settings.players = s.players.slice(0, 200);
      if (typeof s.mode === "string" && DEFAULTS[s.mode]) settings.mode = s.mode;
      else if (s.party === true) settings.mode = "party";
      if (s.rules && typeof s.rules === "object") {
        Object.keys(DEFAULTS).forEach(function (m) {
          if (s.rules[m] && typeof s.rules[m] === "object") {
            settings.rules[m] = {};
            for (var n = 1; n <= 6; n++) {
              if (typeof s.rules[m][n] === "string") settings.rules[m][n] = s.rules[m][n].slice(0, 60);
            }
          }
        });
      }
      if (s.step >= 15 && s.step <= 90) settings.step = s.step;
    }
  } catch (e) {}
  function saveSettings() {
    try { localStorage.setItem("swipedice.settings", JSON.stringify(settings)); } catch (e) {}
  }
  var PIPS = {
    1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9],
    5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9]
  };
  var stage = document.getElementById("stage");
  var live = document.getElementById("live");
  var minus = document.getElementById("minus");
  var plus = document.getElementById("plus");
  var count = 2, values = [], panels = [];

  try {
    var saved = parseInt(localStorage.getItem("swipedice.count"), 10);
    if (saved >= MIN && saved <= MAX) count = saved;
  } catch (e) {}

  function rnd() { return 1 + Math.floor(Math.random() * 6); }
  function buzz() { try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {} }

  function build() {
    stage.innerHTML = "";
    panels = [];
    for (var i = 0; i < count; i++) {
      var p = document.createElement("div");
      p.className = "panel";
      var f = document.createElement("div");
      f.className = "face";
      for (var k = 0; k < 9; k++) {
        var d = document.createElement("div");
        d.className = "pip off";
        f.appendChild(d);
      }
      p.appendChild(f);
      var r = document.createElement("div");
      r.className = "rule";
      p.appendChild(r);
      stage.appendChild(p);
      panels.push(p);
    }
    minus.disabled = count <= MIN;
    plus.disabled = count >= MAX;
  }

  function render() {
    panels.forEach(function (p, i) {
      var v = values[i];
      p.style.backgroundColor = "var(--c" + v + ")";
      var on = PIPS[v];
      var pips = p.firstChild.children;
      for (var k = 0; k < 9; k++) {
        pips[k].classList.toggle("off", on.indexOf(k + 1) === -1);
      }
    });
    panels.forEach(function (p, i) {
      p.lastChild.textContent = ruleText(values[i]);
    });
    if (!busy) {
      live.textContent = settings.mode !== "off"
        ? values.map(function (v) { return v + ": " + ruleText(v); }).join(". ")
        : values.join(", ");
    }
  }

  function rollAll() {
    for (var i = 0; i < count; i++) {
      var v = rnd();
      if (values[i] === v) v = (v % 6) + 1;
      values[i] = v;
    }
    busy = true;
    render();
    setFx("spin");
    buzz();
    beep(480 + Math.random() * 420, 0.04, 0.07);
  }

  var actx = null;
  function beep(freq, dur, vol) {
    if (!settings.sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "triangle";
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  var turnEl = document.getElementById("turn"), turnIdx = 0;
  function playerList() {
    return settings.players.split(/[,\n]/).map(function (x) { return x.trim().slice(0, 24); })
      .filter(Boolean).slice(0, 12);
  }
  function showTurn() {
    var list = playerList();
    if (!list.length) { turnEl.hidden = true; return; }
    turnEl.textContent = list[turnIdx % list.length];
    turnEl.hidden = false;
    turnIdx++;
  }

  function setFx(cls) {
    panels.forEach(function (p) {
      var f = p.firstChild;
      f.classList.remove("spin", "slow", "land");
      if (cls) { void f.offsetWidth; f.classList.add(cls); }
    });
  }

  // After the finger lifts the dice keep going around, slow down, then land on the final faces.
  var busy = false, settleT = null;
  function cancelSettle() {
    if (settleT) { clearTimeout(settleT); settleT = null; }
  }
  function settle() {
    cancelSettle();
    var delays = [70, 80, 95, 115, 140, 175, 225, 290, 370, 460];
    var i = 0;
    (function step() {
      rollAll();
      if (i >= delays.length - 1) {
        busy = false;
        render();
        setFx("land");
        beep(220, 0.2, 0.18);
        showTurn();
        settleT = setTimeout(function () { setFx(null); settleT = null; }, 480);
        return;
      }
      if (i >= 6) setFx("slow");
      settleT = setTimeout(step, delays[i++]);
    })();
  }

  function fresh() {
    values = [];
    for (var i = 0; i < count; i++) values.push(rnd());
    render();
  }

  // Slide to roll: every STEP_PX of finger travel tumbles the dice; they stay on whatever shows when the finger lifts.
  var down = false, lx = 0, ly = 0, acc = 0, moved = 0;
  stage.addEventListener("pointerdown", function (e) {
    cancelSettle();
    down = true; lx = e.clientX; ly = e.clientY; acc = 0; moved = 0;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    stage.style.cursor = "grabbing";
  });
  stage.addEventListener("pointermove", function (e) {
    if (!down) return;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    var dist = Math.sqrt(dx * dx + dy * dy);
    acc += dist; moved += dist;
    while (acc >= settings.step) { acc -= settings.step; rollAll(); }
  });
  function end() {
    if (!down) return;
    down = false;
    stage.style.cursor = "grab";
    if (moved >= 8 || settings.tap) {
      settle(); // a tap rolls only when enabled in settings
    } else {
      busy = false; setFx(null); render();
    }
  }
  stage.addEventListener("pointerup", end);
  stage.addEventListener("pointercancel", function () { down = false; stage.style.cursor = "grab"; });

  function setCount(n) {
    cancelSettle(); busy = false;
    count = Math.max(MIN, Math.min(MAX, n));
    try { localStorage.setItem("swipedice.count", String(count)); } catch (e) {}
    build(); fresh();
  }
  minus.addEventListener("click", function () { setCount(count - 1); });
  plus.addEventListener("click", function () { setCount(count + 1); });

  var sheet = document.getElementById("sheet");
  var tapRoll = document.getElementById("tapRoll");
  var stepRange = document.getElementById("stepRange");
  var stepOut = document.getElementById("stepOut");
  tapRoll.checked = settings.tap;
  stepRange.value = settings.step;
  stepOut.textContent = settings.step + " px";
  document.getElementById("gear").addEventListener("click", function () { sheet.hidden = !sheet.hidden; });
  document.getElementById("done").addEventListener("click", function () { sheet.hidden = true; });
  var modeSel = document.getElementById("modeSel");
  var modeNote = document.getElementById("modeNote");
  var editor = document.getElementById("editor");
  var ruleFields = document.getElementById("ruleFields");
  var FACE_COLORS = { 1: "var(--c1)", 2: "var(--c2)", 3: "var(--c3)", 4: "var(--c4)", 5: "var(--c5)", 6: "var(--c6)" };

  function buildEditor() {
    var m = settings.mode;
    editor.hidden = m === "off";
    modeNote.hidden = m !== "party";
    modeNote.textContent = m === "party"
      ? "For adults of legal drinking age. Water or soft drinks count too. Never drive after drinking."
      : "";
    ruleFields.innerHTML = "";
    if (m === "off") return;
    for (var n = 1; n <= 6; n++) {
      (function (n) {
        var row = document.createElement("label");
        row.className = "rf";
        var badge = document.createElement("b");
        badge.textContent = n;
        badge.style.background = FACE_COLORS[n];
        var input = document.createElement("input");
        input.type = "text";
        input.maxLength = 60;
        input.value = ruleText(n);
        input.placeholder = DEFAULTS[m][n];
        input.setAttribute("aria-label", "Rule for face " + n);
        input.addEventListener("input", function () {
          if (!settings.rules[m]) settings.rules[m] = {};
          settings.rules[m][n] = input.value;
          saveSettings();
          render();
        });
        row.appendChild(badge);
        row.appendChild(input);
        ruleFields.appendChild(row);
      })(n);
    }
  }

  MODES.forEach(function (m) {
    var o = document.createElement("option");
    o.value = m.id;
    o.textContent = m.label;
    modeSel.appendChild(o);
  });
  modeSel.value = settings.mode;
  modeSel.addEventListener("change", function () {
    settings.mode = modeSel.value;
    saveSettings();
    buildEditor();
    render();
  });
  document.getElementById("resetRules").addEventListener("click", function () {
    delete settings.rules[settings.mode];
    saveSettings();
    buildEditor();
    render();
  });
  buildEditor();
  tapRoll.addEventListener("change", function () { settings.tap = tapRoll.checked; saveSettings(); });
  stepRange.addEventListener("input", function () {
    settings.step = parseInt(stepRange.value, 10);
    stepOut.textContent = settings.step + " px";
    saveSettings();
  });

  var soundOn = document.getElementById("soundOn");
  soundOn.checked = settings.sound;
  soundOn.addEventListener("change", function () {
    settings.sound = soundOn.checked;
    saveSettings();
    beep(440, 0.08, 0.12);
  });

  var playersEl = document.getElementById("players");
  playersEl.value = settings.players;
  playersEl.addEventListener("input", function () {
    settings.players = playersEl.value.slice(0, 200);
    saveSettings();
    turnIdx = 0;
    if (!playerList().length) turnEl.hidden = true;
  });

  var shareBox = document.getElementById("shareBox");
  document.getElementById("copyRules").addEventListener("click", function () {
    var code = JSON.stringify({ v: 1, rules: settings.rules });
    shareBox.value = code;
    try {
      navigator.clipboard.writeText(code).catch(function () { shareBox.select(); });
    } catch (e) { shareBox.select(); }
  });
  document.getElementById("loadRules").addEventListener("click", function () {
    try {
      var d = JSON.parse(shareBox.value);
      if (!d || typeof d.rules !== "object" || !d.rules) throw new Error("bad");
      Object.keys(DEFAULTS).forEach(function (m) {
        if (d.rules[m] && typeof d.rules[m] === "object") {
          settings.rules[m] = {};
          for (var n = 1; n <= 6; n++) {
            if (typeof d.rules[m][n] === "string") settings.rules[m][n] = d.rules[m][n].slice(0, 60);
          }
        }
      });
      saveSettings(); buildEditor(); render();
      shareBox.value = "";
      shareBox.placeholder = "Rules loaded.";
    } catch (e) {
      shareBox.value = "";
      shareBox.placeholder = "That code did not work. Paste the full code from Copy.";
    }
  });

  build();
  fresh();
})();
</script>

</html>
